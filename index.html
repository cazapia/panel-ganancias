<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<title>Pagos · Panel de creador</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;
  --ink:#111111; --muted:#5f6368; --bg:#ffffff; --card:#ffffff;
  --teal:#1a6ed8; --teal-d:#1559b0; --lime:#e3eefc; --line:#e3e6ea; --bar:#9cc9f5; --chip:#e8f1fd; --star:#e08a1e; --verde:#1e8e3e;
  --shadow:0 2px 10px rgba(0,0,0,.07);
  --ff-h:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --ff-b:"Figtree","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:var(--ff-b);background:var(--bg);color:var(--ink);min-height:100%;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:flex;justify-content:center;
  -webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:460px;padding:12px 0 40px}
.pad{padding:0 16px}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}

/* Encabezado */
.top{display:grid;grid-template-columns:44px 1fr auto;align-items:center;padding:0 12px;margin-bottom:12px}
.icon-btn{width:40px;height:40px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;border-radius:50%}
.icon-btn:active{background:var(--chip)}
.icon-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top h1{font:800 21px/1 var(--ff-h);text-align:center}
.top-r{display:flex;align-items:center;gap:2px}
.avatar{position:relative;width:36px;height:36px;margin-left:4px;flex:none;border:0;padding:0;background:transparent;border-radius:50%}
.foto{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-size:20px}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .flecha svg{transition:transform .2s}
.avatar[aria-expanded=true] .flecha svg{transform:rotate(180deg)}
/* Menú de perfiles */
.perfiles-wrap{position:relative}
.menu-perfiles{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;z-index:50;transform-origin:top right;animation:abrirMenu .16s ease}
@keyframes abrirMenu{from{opacity:0;transform:scale(.95) translateY(-4px)}to{opacity:1;transform:none}}
.menu-perfiles p{font-size:12px;color:var(--muted);padding:8px 10px 4px}
.opcion{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:10px;
  text-align:left;font:500 15px var(--ff-b);color:var(--ink)}
.opcion:hover,.opcion:focus-visible{background:var(--chip)}
.opcion .foto{width:34px;height:34px;flex:none;font-size:18px}
.opcion span{flex:1}
.opcion .check{width:18px;height:18px;stroke:var(--teal);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.opcion[aria-current=true]{background:var(--chip);font-weight:600}
.opcion[aria-current=true] .check{visibility:visible}
.avatar .flecha{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(0,0,0,.25);display:grid;place-items:center}
.avatar .flecha svg{width:11px;height:11px;stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}


/* Pestañas */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 2px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--ink);font:500 15px var(--ff-b);padding:10px 16px;border-radius:22px;white-space:nowrap;transition:background .2s}
.tab[aria-selected=true]{background:var(--chip);font-weight:600}

.coin{flex:none;width:44px;height:44px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:22px}
.x{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);font-size:15px;line-height:1}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--teal);color:#fff;font:700 16px var(--ff-h);padding:13px;border-radius:10px;margin-top:14px;border:0;transition:background .2s,transform .1s}
.btn:hover{background:var(--teal-d)}
.btn:active{transform:scale(.98)}

/* Pendiente de cobro */
.panel{background:var(--card);border-radius:14px;padding:18px;border:1px solid var(--line);margin-bottom:12px;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h3{font:700 18px var(--ff-h);display:flex;align-items:center;gap:8px}
.link{color:var(--teal);font-weight:600;font-size:15px;text-decoration:none;background:none;border:0;padding:4px 0}

.amount{font:800 32px/1.1 var(--ff-h);margin:10px 0 4px}

/* Gráfico */
.chart-wrap{position:relative;margin:26px 0 6px 40px}
.chart{position:relative;height:150px;display:flex;align-items:flex-end;gap:10px;padding:0 4px;border-bottom:1px solid var(--line)}
.grid{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.y{position:absolute;left:-40px;font-size:12px;color:var(--muted);transform:translateY(-50%)}
.bar{flex:1;position:relative;background:var(--bar);border:0;padding:0;border-radius:4px 4px 0 0;height:0;min-height:0;
  transition:height .9s cubic-bezier(.2,.8,.2,1),background .2s}
.bar.sel{background:var(--teal)}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);
  font:600 12px var(--ff-b);padding:4px 7px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.bar.sel .tip{opacity:1}
.months{display:flex;gap:10px;margin-left:40px;padding:6px 4px 0;font-size:13px;color:var(--muted)}
.months span{flex:1;text-align:center}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}

/* Vista clásica (tabla) */
.tabla{margin-top:14px}
.tabla div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.tabla div:last-child{border-bottom:0}
.tabla span:last-child{font-weight:600}
.classic{display:block;margin:0 0 18px auto;border:1px solid var(--line);background:var(--card);color:var(--teal);font:600 14px var(--ff-b);padding:7px 14px;border-radius:20px}

/* Actividad */
.act-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.act-head h4{font:700 19px var(--ff-h)}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{flex:none;width:30px;height:30px;display:grid;place-items:center;font-size:20px}
.row .t{flex:1;min-width:0;font-size:16px;line-height:1.3}
.row .t small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.row .m{text-align:right;font:700 18px var(--ff-h);color:var(--verde)}
.row .m small{display:block;font:400 12px/1.35 var(--ff-b);color:var(--muted);margin-top:2px}
.total{display:flex;justify-content:space-between;font:700 16px var(--ff-h);padding-top:12px;margin-top:4px;border-top:2px solid var(--line)}

.sin-datos{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:14px;color:var(--muted);pointer-events:none}
.sin-datos span{background:var(--card);padding:6px 12px;border-radius:8px;border:1px solid var(--line)}
.vacio{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px;line-height:1.45}
.vacio b{display:block;color:var(--ink);font:700 16px var(--ff-h);margin-bottom:4px}

/* Formas de cobro */
.empty{text-align:center;padding:26px 18px}
.empty .coin{margin:0 auto 12px;width:56px;height:56px;font-size:28px}
.empty h3{justify-content:center;margin-bottom:6px}
.empty p{font-size:14px;color:var(--muted);line-height:1.45}


.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bar{transition:none}.fade{animation:none}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <button class="icon-btn" id="volver" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1>Pagos</h1>
    <div class="top-r">
      <button class="icon-btn" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <div class="perfiles-wrap">
        <button class="avatar" id="avatarBtn" aria-haspopup="true" aria-expanded="false" aria-label="Cambiar de página"><span class="foto" id="fotoActual"></span><span class="flecha"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span></button>
        <div class="menu-perfiles" id="menuPerfiles" role="menu" hidden>
          <p>Tus páginas</p>
          <div id="listaPerfiles"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" aria-controls="p-general" id="t-general">Información general</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="p-trans" id="t-trans">Transacciones</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="p-formas" id="t-formas">Formas de cobro</button>
  </div>

  <!-- ===== PESTAÑA 1: INFORMACIÓN GENERAL ===== -->
  <div id="p-general" role="tabpanel" aria-labelledby="t-general">
    <div class="pad">
      <section class="panel">
        <div class="panel-head"><h3>Total de ingresos</h3><button class="link" data-ir="trans">Ver todas</button></div>
        <div class="amount" id="monto"></div>

        <div id="vistaGrafico">
          <div class="chart-wrap">
            <span class="grid" style="top:0"></span><span class="grid" style="top:75px"></span>
            <span class="y" id="yMax" style="top:0">US$4</span><span class="y" id="yMid" style="top:75px">US$2</span><span class="y" style="top:150px">US$0</span>
            <div class="chart" id="chart" role="group" aria-label="Gráfico de ingresos de junio a noviembre"></div>
          </div>
          <div class="months" id="months"></div>
          <p class="hint">Toca una barra para ver el monto del mes</p>
        </div>
        <div class="tabla" id="vistaTabla" hidden></div>
      </section>

      <button class="classic" id="classic">Cambiar a la vista clásica</button>

      <section>
        <div class="act-head"><h4>Actividad reciente</h4><button class="link" data-ir="trans">Ver todo</button></div>
        <div id="actividad"></div>
      </section>

    </div>
  </div>

  <!-- ===== PESTAÑA 2: TRANSACCIONES ===== -->
  <div id="p-trans" class="pad" role="tabpanel" aria-labelledby="t-trans" hidden>
    <section class="panel">
      <div class="act-head"><h4>Todas las transacciones</h4></div>
      <div id="todas"></div>
      <div class="total"><span>Total acumulado</span><span id="totalTxt" style="color:var(--verde)"></span></div>
    </section>
  </div>

  <!-- ===== PESTAÑA 3: FORMAS DE COBRO ===== -->
  <div id="p-formas" class="pad" role="tabpanel" aria-labelledby="t-formas" hidden>
    <section class="panel empty">
      <div class="coin" aria-hidden="true">🏦</div>
      <h3>Aún no tienes una forma de cobro</h3>
      <p>Agrega tu cuenta para recibir tus ingresos cuando superes el monto mínimo.</p>
      <a class="btn" id="cta3" href="#">Agregar forma de cobro</a>
    </section>
  </div>

</main>

<script>
/* =========================================================
   ✏️ CONFIGURACIÓN: cambia solo esta parte
   ========================================================= */
var CONFIG = {
  enlaceCobro:   "#",   // botón "Agregar forma de cobro"
  minimo: 25           // monto mínimo para cobrar (USD)
};

// Tus páginas. Cada una tiene su nombre, su foto y sus ingresos
// (fecha año-mes-día y monto en USD). Para darle foto a una página,
// pon la imagen en la carpeta images y escribe su nombre en "foto".
var PERFILES = {
  "frutinovelas": {
    nombre: "Frutinovelas TV",
    foto: "images/avatar.jpg",
    ingresos: [
      { fecha: "2026-11-16", monto: 45.23 },
      { fecha: "2026-11-15", monto: 68.34 },
      { fecha: "2026-11-14", monto: 137.69 },
      { fecha: "2026-11-13", monto: 58.90 },
      { fecha: "2026-11-12", monto: 345.21 },
      { fecha: "2026-11-10", monto: 76.10 },
      { fecha: "2026-11-09", monto: 234.20 },
      { fecha: "2026-11-08", monto: 13.40 },
      { fecha: "2026-11-07", monto: 19.70 }
    ]
  },
  "perrito-pelon": {
    nombre: "Perrito Pelón",
    foto: "", emoji: "🐶", color: "#fde7c8",
    ingresos: []
  },
  "gato-cenatino": {
    nombre: "Gato Cenatino",
    foto: "", emoji: "🐱", color: "#e4e1fb",
    ingresos: []
  },
  "aprende-ia": {
    nombre: "Aprende IA",
    foto: "", emoji: "🤖", color: "#d9f1ea",
    ingresos: [
      { fecha: "2026-11-22", monto: 34.16 },
      { fecha: "2026-11-21", monto: 8.82 },
      { fecha: "2026-11-20", monto: 13.47 }
    ]
  }
};

// Página que se está viendo (se elige con el menú de la foto de perfil)
var idActual = location.hash.replace("#", "");
if (!PERFILES[idActual]) idActual = "frutinovelas";
var actual = PERFILES[idActual];
var INGRESOS = actual.ingresos;
/* ========================================================= */

var NOMBRES_MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function dinero(n) {
  var p = n.toFixed(2).split(".");
  return "$" + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + p[1];
}
function fechaBonita(f) {
  var x = f.split("-");
  return parseInt(x[2], 10) + " " + NOMBRES_MES[parseInt(x[1], 10) - 1] + ". " + x[0];
}

// Suma por mes (de junio a noviembre de 2026) para el gráfico
var DATOS = [6, 7, 8, 9, 10, 11].map(function (m) {
  var suma = INGRESOS.reduce(function (s, d) {
    var x = d.fecha.split("-");
    return (x[0] === "2026" && parseInt(x[1], 10) === m) ? s + d.monto : s;
  }, 0);
  return { mes: NOMBRES_MES[m - 1], monto: suma };
});
var mayor = Math.max.apply(null, DATOS.map(function (d) { return d.monto; }));
var maxGrafico = 4;
if (mayor > 0) {
  var base = Math.pow(10, Math.floor(Math.log10(mayor)));
  maxGrafico = [1, 2, 2.5, 5, 10].map(function (k) { return k * base; }).filter(function (v) { return v >= mayor; })[0];
}
function corto(n) { return "US$" + (n % 1 ? n.toFixed(1).replace(".", ",") : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".")); }

function $(id) { return document.getElementById(id); }
$("yMax").textContent = corto(maxGrafico);
$("yMid").textContent = corto(maxGrafico / 2);

// Enlaces de botones
$("cta3").href = CONFIG.enlaceCobro;

// Total de ingresos
var total = INGRESOS.reduce(function (s, d) { return s + d.monto; }, 0);
var alcanzado = total >= CONFIG.minimo;
$("monto").textContent = dinero(total) + " USD";
$("totalTxt").textContent = dinero(total) + " USD";

// Gráfico de barras
var chart = $("chart"), months = $("months");
var barras = DATOS.map(function (d) {
  var b = document.createElement("button");
  b.className = "bar";
  b.setAttribute("aria-label", d.mes + ": " + dinero(d.monto));
  b.innerHTML = '<span class="tip">' + dinero(d.monto) + '</span>';
  b.addEventListener("click", function () {
    var yaSel = b.classList.contains("sel");
    barras.forEach(function (x) { x.classList.remove("sel"); });
    if (!yaSel) b.classList.add("sel");
  });
  chart.appendChild(b);
  var m = document.createElement("span");
  m.textContent = d.mes;
  months.appendChild(m);
  return b;
});
requestAnimationFrame(function () {
  barras.forEach(function (b, i) {
    setTimeout(function () {
      b.style.height = Math.min(100, DATOS[i].monto / maxGrafico * 100) + "%";
    }, 120 * i);
  });
});

// Vista clásica (tabla por mes)
$("vistaTabla").innerHTML = DATOS.map(function (d) {
  return "<div><span>" + d.mes + "</span><span>" + dinero(d.monto) + "</span></div>";
}).join("");
$("classic").addEventListener("click", function () {
  var clasica = $("vistaTabla").hidden;
  $("vistaTabla").hidden = !clasica;
  $("vistaGrafico").hidden = clasica;
  (clasica ? $("vistaTabla") : $("vistaGrafico")).classList.add("fade");
  this.textContent = clasica ? "Cambiar a la vista nueva" : "Cambiar a la vista clásica";
});

// Filas de actividad
function fila(d) {
  return '<div class="row"><div class="ic" aria-hidden="true">💵</div>' +
    '<div class="t">' + actual.nombre + '<small>Ingresos por contenido</small><small>' + fechaBonita(d.fecha) + '</small></div>' +
    '<div class="m">' + dinero(d.monto) + ' USD<small>Monto bruto: ' + dinero(d.monto) + '<br>' +
    (alcanzado ? 'Listo para pago' : 'Listo, por debajo del límite') + '</small></div></div>';
}
var conIngresos = INGRESOS.filter(function (d) { return d.monto > 0; })
  .sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
var VACIO = '<div class="vacio"><b>Aún no hay actividad</b>Aquí verás tus ingresos cuando empieces a generarlos.</div>';
$("actividad").innerHTML = conIngresos.length ? conIngresos.slice(0, 2).map(fila).join("") : VACIO;
$("todas").innerHTML = conIngresos.length ? conIngresos.map(fila).join("") : VACIO.replace("actividad", "transacciones");

// Si todavía no hay ingresos, se muestra un aviso sobre el gráfico
if (total === 0) {
  var aviso = document.createElement("div");
  aviso.className = "sin-datos";
  aviso.innerHTML = "<span>Todavía no hay ingresos</span>";
  chart.appendChild(aviso);
  document.querySelector(".hint").hidden = true;
}

// Pestañas
function abrir(nombre) {
  ["general", "trans", "formas"].forEach(function (n) {
    var activa = n === nombre;
    $("t-" + n).setAttribute("aria-selected", activa ? "true" : "false");
    $("p-" + n).hidden = !activa;
    if (activa) $("p-" + n).classList.add("fade");
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.querySelectorAll(".tab").forEach(function (t) {
  t.addEventListener("click", function () { abrir(t.id.slice(2)); });
});
document.querySelectorAll("[data-ir]").forEach(function (b) {
  b.addEventListener("click", function () { abrir(b.getAttribute("data-ir")); });
});

// Botón volver: si estás en otra pestaña, regresa a "Información general"
$("volver").addEventListener("click", function () {
  if ($("p-general").hidden) abrir("general");
  else if (history.length > 1) history.back();
});

// Foto de perfil y menú para cambiar de página
function fotoHTML(p) {
  return p.foto ? '<img src="' + p.foto + '" alt="">' : p.emoji;
}
function pintarFoto(el, p) {
  el.innerHTML = fotoHTML(p);
  el.style.background = p.foto ? "transparent" : p.color;
}
pintarFoto($("fotoActual"), actual);
document.title = "Pagos · " + actual.nombre;
Object.keys(PERFILES).forEach(function (id) {
  var p = PERFILES[id];
  var b = document.createElement("button");
  b.className = "opcion";
  b.setAttribute("role", "menuitem");
  if (id === idActual) b.setAttribute("aria-current", "true");
  b.innerHTML = '<span class="foto"></span><span>' + p.nombre + '</span>' +
    '<svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
  pintarFoto(b.querySelector(".foto"), p);
  b.addEventListener("click", function () {
    if (id === idActual) { cerrarMenu(); return; }
    location.hash = id;
    location.reload();
  });
  $("listaPerfiles").appendChild(b);
});
function cerrarMenu() {
  $("menuPerfiles").hidden = true;
  $("avatarBtn").setAttribute("aria-expanded", "false");
}
$("avatarBtn").addEventListener("click", function (e) {
  e.stopPropagation();
  var abrir = $("menuPerfiles").hidden;
  $("menuPerfiles").hidden = !abrir;
  this.setAttribute("aria-expanded", abrir ? "true" : "false");
});
document.addEventListener("click", function (e) {
  if (!$("menuPerfiles").hidden && !e.target.closest(".perfiles-wrap")) cerrarMenu();
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") cerrarMenu(); });

</script>
</body>
</html>
